# xcodegen spec — run `xcodegen` in this folder to produce
# BambuserCallsShopperUIKitDemo.xcodeproj.
#
# Install: brew install xcodegen

name: BambuserCallsShopperUIKitDemo
options:
  bundleIdPrefix: com.bambuser.demo
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"

packages:
  BambuserCallsShopper:
    path: ../

targets:
  BambuserCallsShopperUIKitDemo:
    type: application
    platform: iOS
    sources:
      - path: BambuserCallsShopperUIKitDemo
    info:
      path: BambuserCallsShopperUIKitDemo/Info.plist
      properties:
        # Info.plist's contents are the source of truth — the file
        # itself defines usage strings, scene manifest, etc.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bambuser.demo.BambuserCallsShopperUIKitDemo
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: BambuserCallsShopperUIKitDemo/Info.plist
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: BambuserCallsShopper
        product: BambuserCalls-shopper
